<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Bahan Ajar UT</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body class="bg-light">
    <div id="app" class="container-fluid px-4 py-3">
      <nav
        class="navbar navbar-expand navbar-dark bg-dark px-3 py-3 mb-4 shadow"
      >
        <ul class="navbar-nav gap-4">
          <!-- Tab Stok  -->
          <li class="nav-item">
            <a
              class="nav-link text-white"
              :class="{'fw-bold text-warning': tab === 'stok'}"
              href="#"
              @click.prevent="tab = 'stok'"
            >
              Informasi Stok Bahan Ajar
            </a>
          </li>

          <!-- Tab Tracking  -->
          <li class="nav-item">
            <a
              class="nav-link text-white"
              :class="{'fw-bold text-warning': tab === 'tracking'}"
              href="#"
              @click.prevent="tab = 'tracking'"
            >
              Tracking Pengiriman
            </a>
          </li>

          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle text-white"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
            >
              Laporan
            </a>
            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item" href="#"
                  >Monitoring Progress DO Bahan Ajar</a
                >
              </li>
              <li><a class="dropdown-item" href="#">Rekap Bahan Ajar</a></li>
            </ul>
          </li>

          <li class="nav-item">
            <a class="nav-link text-white" href="#"
              >History Transaksi Bahan Ajar</a
            >
          </li>
        </ul>
      </nav>

      <div class="container-fluid px-4">
        <section v-show="tab === 'stok'">
          <ba-stock-table
            :daftar-stok="state.stok"
            :upbjj-list="state.upbjjList"
            :kategori-list="state.kategoriList"
          >
          </ba-stock-table>
        </section>

        <section v-show="tab === 'tracking'">
          <do-tracking
            :database-tracking="state.tracking"
            :list-ekspedisi="state.listEkspedisi"
            :list-Paket="state.listPaket"
          ></do-tracking>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="./js/services/api.js"></script>
    <script src="./js/components/stock-table.js"></script>
    <script src="./js/components/do-tracking.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
